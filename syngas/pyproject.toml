[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syngas"
version = "0.1.0"
description = "syngas scenario: H2/CH4/CO2/CO gas detection."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "hitran-api",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["sg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
