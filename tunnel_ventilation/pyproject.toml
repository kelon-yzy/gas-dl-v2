[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-ventilation"
version = "0.1.0"
description = "tunnel_ventilation scenario: CO2/O2/N2 gas detection."
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "threadpoolctl",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
tabpfn = [
    "tabpfn",
]

[tool.setuptools.packages.find]
include = ["tv3*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
