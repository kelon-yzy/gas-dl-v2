data:
  dataset_root: "data/rcdw-formal"        # [新增] benchmark 数据根目录
  window: 8
  seed: 42
  train_modalities: ["slow", "ultrasonic"] # [新增] 明确不进 fiber_mic
  # 旧字段(Phase 4 移除):
  n_train: 1400
  n_val: 300
  n_test: 300

generation:                               # [新增] 生成参数节(方案 §10.1)
  sequence_count: 2000
  seed: 42
  timesteps: 128
  dt_s: 0.5
  storage: "memmap"
  multi_path_phase: "steady"
  stage_profile: "standard_exposure"
  stage_jitter: 0.0
  sampling_strategy: "lhs"
  path_lms: [0.20, 0.25, 0.30, 0.35, 0.40]
  optical_absorption_backend: "hitran_hapi_v1"
  hitran_cache_root: "data/hitran_cache"

spectral:
  config_path: "configs/spectral-defaults.json"

phases:
  default_schedule: "standard_exposure"

splits:
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  group_field: "mixture_id"

scalers:
  transform_target: "slow"
  modal_groups_from_schema: true

model:
  single_modal:
    hidden: 32
  error_net:
    hidden: 32
  fusion:
    beta: 8.0
    alpha_min: 0.1
    alpha_max: 0.9
    tau_a: 0.05
    s_min: 0.05
    s_max: 0.40
    tau_s: 0.05
  # W_base: 行=模态(NDIR/TCD/US), 列=气体(O2/CO2/N2)
  # 每列 sum=1.0
  W_base:
    - [0.05, 0.70, 0.05]
    - [0.50, 0.15, 0.45]
    - [0.45, 0.15, 0.50]

training:
  stage_a:
    epochs: 200
    batch_size: 16
    lr: 1.0e-3
    weight_decay: 1.0e-4
    patience: 30
    # NDIR 对 O2/N2 的 loss 降权
    ndir_loss_weights: [0.1, 1.0, 0.1]
  stage_b:
    epochs: 200
    batch_size: 16
    lr: 1.0e-3
    weight_decay: 1.0e-4
    patience: 30
    lambda_error: 1.0
    lambda_sum: 0.1
    freeze_single_modal: true

perturbation:
  kinds:
    - optical_atten
    - optical_scat
    - thermal
    - ultrasonic
    - temperature
  levels: [0, 0.01, 0.03, 0.05, 0.07, 0.09, 0.11]

degradation:
  ratio: 4.0
  cap: 0.04

eval:
  basis: dry
